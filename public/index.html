<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A &amp; S Urbanseat | Furniture and seating for home, office, café and outdoor</title>
    <meta
      name="description"
      content="Furniture and seating for homes, offices, cafés and outdoor spaces, from our own workshop and the makers we trust."
    />
    <meta
      name="keywords"
      content="furniture, seating, chairs, sofas, dining tables, office chairs, office furniture, café furniture, restaurant furniture, outdoor furniture, home furniture, India"
    />
    <meta name="author" content="A &amp; S Urbanseat" />

    <!-- Colour literals copied from prompts/DESIGN_SYSTEM.md (static files
         cannot read CSS variables): paper #faf7f2, dark base #0a1426. -->
    <meta name="theme-color" content="#faf7f2" />
    <meta name="theme-color" content="#0a1426" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph / Facebook. og:url is a placeholder until the production
         domain is confirmed. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="A &amp; S Urbanseat" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://urbanseat.example/" />
    <meta
      property="og:title"
      content="A &amp; S Urbanseat | Furniture and seating for home, office, café and outdoor"
    />
    <meta
      property="og:description"
      content="Furniture and seating for homes, offices, cafés and outdoor spaces, from our own workshop and the makers we trust."
    />
    <meta
      property="og:image"
      content="https://res.cloudinary.com/v8vrixwq/image/upload/v1787597119/urbanseat-logo.png"
    />
    <meta property="og:image:width" content="1286" />
    <meta property="og:image:height" content="426" />
    <meta property="og:image:alt" content="A &amp; S Urbanseat" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://urbanseat.example/" />
    <meta
      name="twitter:title"
      content="A &amp; S Urbanseat | Furniture and seating for home, office, café and outdoor"
    />
    <meta
      name="twitter:description"
      content="Furniture and seating for homes, offices, cafés and outdoor spaces, from our own workshop and the makers we trust."
    />
    <meta
      name="twitter:image"
      content="https://res.cloudinary.com/v8vrixwq/image/upload/v1787597119/urbanseat-logo.png"
    />
    <meta name="twitter:image:alt" content="A &amp; S Urbanseat" />

    <!-- Icons: only files that exist in public/. %PUBLIC_URL% is replaced at
         build time so the paths work with client-side routing. -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- The loading screen's logo is served from Cloudinary. -->
    <link rel="preconnect" href="https://res.cloudinary.com" />

    <!-- Google Fonts: the single font loader (see prompts/DESIGN_SYSTEM.md).
         Playfair Display 400, 500 and 400 italic for display type; Inter for
         UI. Inter keeps 300-700 because the admin uses all five weights. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Loading screen. Light: paper + light logo; dark (body.dark, set by the
         pre-paint script): dark base + white logo. Values from DESIGN_SYSTEM.md:
         paper #faf7f2, dark base #0a1426, accent caramel #ae773d (light) and
         #ddb185 (dark). -->
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans",
          "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        min-height: 100vh;
      }

      #loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #faf7f2;
        z-index: 9999;
        transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      }

      body.dark #loading-screen {
        background-color: #0a1426;
      }

      #loading-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
        width: min(60vw, 320px);
      }

      .loader-logo {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 1286 / 426;
      }

      .loader-progress {
        position: relative;
        width: 50%;
        height: 2px;
        overflow: hidden;
      }

      .loader-progress-bar {
        position: absolute;
        inset: 0;
        background-color: #ae773d;
        transform: scaleX(0);
        transform-origin: left center;
        animation: loaderHairline 2.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      body.dark .loader-progress-bar {
        background-color: #ddb185;
      }

      @keyframes loaderHairline {
        0% {
          transform: scaleX(0);
          transform-origin: left center;
        }
        50% {
          transform: scaleX(1);
          transform-origin: left center;
        }
        50.01% {
          transform-origin: right center;
        }
        100% {
          transform: scaleX(0);
          transform-origin: right center;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #loading-screen {
          transition: none;
        }

        .loader-progress-bar {
          animation: none;
          transform: none;
        }
      }

      /* Hide loading screen when React app loads */
      body.react-loaded #loading-screen {
        display: none;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <script>
      // Theme detection and initial setup — applied BEFORE React mounts (and
      // before the loading screen is parsed) so the first paint already has the
      // correct theme (matches src/context/ThemeContext.js, which keys CSS off
      // body.dark / body.light). Avoids a flash of the wrong theme. The solid
      // colours equal LIGHT/DARK.background.default in src/theme/colors.js.
      (function () {
        var savedTheme = null;
        try {
          savedTheme = localStorage.getItem("theme");
        } catch (e) {}
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;
        var isDark = savedTheme === "dark" || (!savedTheme && prefersDark);

        document.body.classList.add(isDark ? "dark" : "light");
        document.body.style.backgroundColor = isDark ? "#0a1426" : "#faf7f2";
      })();
    </script>

    <!-- Loading Screen -->
    <div id="loading-screen" role="status" aria-label="Loading A &amp; S Urbanseat">
      <div class="loader-container">
        <img
          id="loader-logo"
          class="loader-logo"
          alt="A &amp; S Urbanseat"
          width="1286"
          height="426"
          decoding="async"
          fetchpriority="high"
          data-src-light="https://res.cloudinary.com/v8vrixwq/image/upload/v1787597119/urbanseat-logo.png"
          data-src-white="https://res.cloudinary.com/v8vrixwq/image/upload/v1787597119/urbanseat-logo-white.png"
        />
        <div class="loader-progress" aria-hidden="true">
          <div class="loader-progress-bar"></div>
        </div>
      </div>
    </div>
    <script>
      // Pick the logo variant for the splash background: the light logo on
      // paper, the white logo on the dark base. Set here (not in markup) so
      // only the matching variant is downloaded.
      (function () {
        var logo = document.getElementById("loader-logo");
        if (!logo) return;
        var isDark = document.body.classList.contains("dark");
        logo.src = logo.getAttribute(isDark ? "data-src-white" : "data-src-light");
      })();
    </script>

    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->

    <script>
      // Hide the loading screen once React has mounted. React signals readiness
      // by adding the "react-loaded" class to <body> (see src/index.js). We watch
      // for that class instead of using a fixed delay, so the loader never fades
      // out before content is ready (no flash of unstyled content). A fallback
      // timeout guarantees the loader can never get permanently stuck visible.
      (function () {
        var hidden = false;
        function hideLoadingScreen() {
          if (hidden) return;
          hidden = true;
          document.body.classList.add("react-loaded");
          var loadingScreen = document.getElementById("loading-screen");
          if (loadingScreen) {
            loadingScreen.classList.add("fade-out");
            setTimeout(function () {
              loadingScreen.style.display = "none";
            }, 600);
          }
        }

        if (document.body.classList.contains("react-loaded")) {
          hideLoadingScreen();
        } else if (typeof MutationObserver !== "undefined") {
          var observer = new MutationObserver(function () {
            if (document.body.classList.contains("react-loaded")) {
              hideLoadingScreen();
              observer.disconnect();
            }
          });
          observer.observe(document.body, {
            attributes: true,
            attributeFilter: ["class"],
          });
        }

        // Safety net: never let the loader hang if React is slow or fails.
        setTimeout(hideLoadingScreen, 10000);
      })();
    </script>
  </body>
</html>
